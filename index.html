<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContactHub</title>
  <link rel="icon" type="image/jpeg" href="./images/a4e11b78e6c94821f27832d9c623a805.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/all.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar">
    <div class="container">
      <div class="navbar-left d-flex align-items-center">
        <div class="navbar-logo d-flex align-items-center justify-content-center">
          <i class="fa-solid fa-address-book"></i>
        </div>
        <div class="navbar-logo-content d-flex flex-column align-items-start">
          <h1>Contact<span>Hub</span></h1>
          <p>Smart Contact Manager</p>
        </div>
      </div>

      <ul class="navbar-nav navbar-actions flex-row align-items-center">
        <li class="nav-item button">
          <button class="btn text-light" id="openAdd" data-bs-toggle="modal" data-bs-target="#contactModal">
            <i class="fa-solid fa-plus me-1"></i> Add Contact
          </button>
        </li>
        <li class="nav-item nav-icon"><a class="nav-link" href="#"><i class="fa-solid fa-bell"></i></a></li>
        <li class="nav-item nav-icon"><a class="nav-link" href="#"><i class="fa-solid fa-gear"></i></a></li>
        <li class="nav-item"><div class="profile-img"></div></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="container">

      <!-- ===== Stats ===== -->
      <section class="three-card">
        <div class="row g-3">
          <div class="col-12 col-md-4">
            <div class="card-item d-flex align-items-center">
              <div class="icon blue d-flex align-items-center justify-content-center"><i class="fa-solid fa-users"></i></div>
              <div class="card-content"><h2>TOTAL</h2><p id="statTotal">0</p></div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="card-item d-flex align-items-center">
              <div class="icon orange d-flex align-items-center justify-content-center"><i class="fa-solid fa-star"></i></div>
              <div class="card-content"><h2>FAVORITES</h2><p id="statFav">0</p></div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="card-item d-flex align-items-center">
              <div class="icon red d-flex align-items-center justify-content-center"><i class="fa-solid fa-heart-pulse"></i></div>
              <div class="card-content"><h2>EMERGENCY</h2><p id="statEmg">0</p></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ===== Two columns ===== -->
      <section class="two-column">
        <div class="row g-4">

          <div class="col-lg-9">
            <h1 class="page-title">All Contacts</h1>
            <p class="page-sub">Manage and organize your <span id="countText">0</span> contacts</p>

            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="text" id="search" placeholder="Search by name, phone, or email..." autocomplete="off">
              <button type="button" class="clear" id="clearSearch" aria-label="Clear search"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="contactsGrid" class="row g-3"></div>

            <div id="emptyState" class="empty-state">
              <div class="empty-icon"><i class="fa-solid fa-address-book"></i></div>
              <h3 id="emptyTitle">No contacts found</h3>
              <p id="emptyText">Click "Add Contact" to get started</p>
            </div>
          </div>

          <div class="col-lg-3">
            <aside class="two-cards d-flex flex-column">
              <div class="card-container">
                <div class="card-title orange d-flex align-items-center">
                  <div class="icon orange d-flex align-items-center justify-content-center"><i class="fa-solid fa-star"></i></div>
                  <div class="card-content"><h2>Favorites</h2><p>Quick access to starred contacts</p></div>
                </div>
                <div class="side-list" id="favList"></div>
              </div>

              <div class="card-container">
                <div class="card-title red d-flex align-items-center">
                  <div class="icon red d-flex align-items-center justify-content-center"><i class="fa-solid fa-heart-pulse"></i></div>
                  <div class="card-content"><h2>Emergency</h2><p>Important contacts for urgent calls</p></div>
                </div>
                <div class="side-list" id="emgList"></div>
              </div>
            </aside>
          </div>

        </div>
      </section>
    </div>
  </main>

  <!-- ===== Add / Edit modal ===== -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Add New Contact</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="contactForm" class="modal-body" novalidate>
          <input type="hidden" id="contactId">

          <div class="photo-box">
            <div class="photo-preview" id="photoPreview"><i class="fa-solid fa-user"></i></div>
            <input type="file" id="photoInput" accept="image/png,image/jpeg,image/webp" hidden>
            <button type="button" class="photo-btn" id="photoBtn"><i class="fa-solid fa-camera me-2"></i>Change Photo</button>
            <button type="button" class="photo-remove" id="photoRemove" hidden>Remove</button>
            <div class="photo-err" id="photoErr"></div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="cName">Full Name <span class="req">*</span></label>
            <input type="text" class="form-control" id="cName" placeholder="Enter full name" autocomplete="off">
            <div class="invalid-feedback" id="cNameErr"></div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="cPhone">Phone Number <span class="req">*</span></label>
            <input type="tel" class="form-control" id="cPhone" placeholder="e.g., 01012345678" autocomplete="off">
            <div class="invalid-feedback" id="cPhoneErr"></div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="cEmail">Email Address</label>
            <input type="email" class="form-control" id="cEmail" placeholder="name@example.com" autocomplete="off">
            <div class="invalid-feedback" id="cEmailErr"></div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="cAddress">Address</label>
            <input type="text" class="form-control" id="cAddress" placeholder="Enter address" autocomplete="off">
            <div class="invalid-feedback" id="cAddressErr"></div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="cGroup">Group</label>
            <select class="form-select" id="cGroup">
              <option value="">Select a group</option>
              <option>Family</option>
              <option>Friends</option>
              <option>Work</option>
              <option>School</option>
              <option>Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label" for="cNotes">Notes</label>
            <textarea class="form-control" id="cNotes" rows="3" placeholder="Add notes about this contact"></textarea>
            <div class="invalid-feedback" id="cNotesErr"></div>
          </div>

          <div class="check-row">
            <label><input type="checkbox" class="form-check-input" id="cFav"><i class="fa-solid fa-star star-ic"></i> Favorite</label>
            <label><input type="checkbox" class="form-check-input" id="cEmg"><i class="fa-solid fa-heart-pulse heart-ic"></i> Emergency</label>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-cancel" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-save"><i class="fa-solid fa-check me-2"></i>Save Contact</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
